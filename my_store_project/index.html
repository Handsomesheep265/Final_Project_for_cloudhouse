<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171918" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="线上手帐集市：手帐本、贴纸、胶带、印章、素材包，一站式淘齐记录生活的小物。" />
    <title>手帐集市 · Journal Bazaar</title>
    <script>
      // 首屏渲染前先应用已保存的主题，避免日间/夜间模式切换时出现闪屏
      // （主题键名与 src/utils/useTheme.js 保持一致）
      ;(function () {
        try {
          var stored = localStorage.getItem('journal-bazaar:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
